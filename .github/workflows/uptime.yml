name: uptime
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_line:
        description: 'send a LINE test message'
        type: boolean
        default: false
concurrency:
  group: uptime
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: line test (manual)
        if: ${{ inputs.test_line }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast -H "Authorization: Bearer ${{ secrets.LINE_TOKEN }}" -H "Content-Type: application/json" -d '{"messages":[{"type":"text","text":"🧪 GitHub → LINE 測試成功（這則代表 GitHub 監測可以通知你了）"}]}'
          jq -n '{ok:true,title:"LINE 測試（GitHub 監測）",body:"手動測試：GitHub → LINE 已接通",note:"github-test"}' > /tmp/t.json
          curl -s -X POST https://scefo.com/api/monitor/external -H "X-Monitor-Key: ${{ secrets.UPTIME_KEY }}" -H "Content-Type: application/json" -d @/tmp/t.json || true
      - name: check sites
        id: chk
        run: |
          FAIL=0
          BAD=""
          for u in https://scefo.com/ https://v8i8.com/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$u" || echo 000)
            case "$u" in
              https://scefo.com/) name="轉運站 scefo.com" ;;
              https://v8i8.com/)  name="v8i8.com" ;;
              *) name="$u" ;;
            esac
            echo "$u => $code"
            if [ "$code" != "200" ]; then FAIL=1; BAD="$BAD;;$name(回應 $code)"; fi
          done
          echo "bad=$BAD" >> "$GITHUB_OUTPUT"
          exit $FAIL
      - name: notify LINE
        if: failure()
        run: |
          BAD="${{ steps.chk.outputs.bad }}"
          BAD="${BAD//;;/$'\n- '}"
          MSG=$(printf '🔴 網站異常通知\n\n有網站掛了：\n- %s\n\n時間：%s\n（詳情請查 GitHub Actions）' "$BAD" "$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')")
          jq -n --arg t "$MSG" '{messages:[{type:"text",text:$t}]}' > /tmp/line.json
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast -H "Authorization: Bearer ${{ secrets.LINE_TOKEN }}" -H "Content-Type: application/json" -d @/tmp/line.json
      - name: report to admin panel
        if: failure()
        run: |
          BAD="${{ steps.chk.outputs.bad }}"
          BAD="${BAD//;;/, }"
          jq -n --arg t "網站異常（GitHub 外部監測）" --arg b "掛掉的網站：$BAD" '{ok:false,title:$t,body:$b,note:"github"}' > /tmp/ext.json
          curl -s -X POST https://scefo.com/api/monitor/external -H "X-Monitor-Key: ${{ secrets.UPTIME_KEY }}" -H "Content-Type: application/json" -d @/tmp/ext.json || true
      - name: open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const bad = "${{ steps.chk.outputs.bad }}".replace(/;;/g, " | ");
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open'});
            if (open.data.some(i => i.title.startsWith('ALERT'))) { console.log('already open'); return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'ALERT: website down ' + new Date().toISOString(),
              body: '掛掉的網站：' + bad + '\n\n（修好後請關閉本 Issue）'
            });
